<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#f7b733">
<title>GOLDEN FRONT: COMMAND</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<div id="app">
  <section id="menu" class="screen">
    <div class="logo">GOLDEN FRONT <span>COMMAND</span></div>
    <p class="tagline">استراتژی، اقتصاد و فرماندهی • نسخه 3.2.0</p>
    <div class="server-page-head"><h2>🌐 سرورها</h2><p class="muted">یک سرور را برای شروع انتخاب کنید.</p></div>
    <div class="server-card server-list">
      <button class="server-item server-open" data-server="0"><span class="server-icon">🖥️</span><span><b>سرور ۰: آفلاین</b><small>قابل بازی • حالت تک‌نفره با هوش مصنوعی</small></span><strong>ورود ←</strong></button>
      <button class="server-item server-open" data-server="1"><span class="server-icon">🌐</span><span><b>سرور ۱: آنلاین</b><small>قابل بازی • انتخاب کشور توسط بازیکنان</small></span><strong>ورود ←</strong></button>
      <button class="server-item server-closed" disabled><span class="server-icon">🌐</span><span><b>سرور ۲: آنلاین</b><small>به‌زودی</small></span><strong>بسته</strong></button>
      <button class="server-item server-closed" disabled><span class="server-icon">🌐</span><span><b>سرور ۳: آنلاین</b><small>به‌زودی</small></span><strong>بسته</strong></button>
      <button class="server-item server-closed" disabled><span class="server-icon">🌐</span><span><b>سرور ۴: آنلاین</b><small>به‌زودی</small></span><strong>بسته</strong></button>
      <button class="server-item server-closed" disabled><span class="server-icon">🌐</span><span><b>سرور ۵: آنلاین</b><small>به‌زودی</small></span><strong>بسته</strong></button>
    </div>
    <button data-action="auth" id="authBtn">☁️ ورود / ثبت‌نام</button>
    <div class="version" id="versionLabel">v3.2.0</div>
  </section>

  <div id="serverChoiceModal" class="modal hidden"><div class="modalbox"><button id="closeServerChoice" class="close">×</button><div id="serverChoiceContent"></div></div></div>

  <section id="game" class="screen hidden">
    <header class="topbar"><button data-action="back">☰</button><div id="countryTitle">کشور شما</div><div class="level">LV <b id="level">1</b></div></header>
    <div class="resources" id="resources"></div>
    <div class="eventline" id="eventline">تولید منابع هر دقیقه انجام می‌شود؛ برای دریافت روی دکمه بزنید.</div>
    <main id="panel"></main>
    <nav class="tabs">
      <button data-tab="base">🏗️<span>پایگاه</span></button>
      <button data-tab="army">⚔️<span>ارتش</span></button>
      <button data-tab="countries">🗺️<span>نقشه</span></button>
      <button data-tab="upgrade">🧪<span>فناوری</span></button>
      <button data-tab="diplomacy">🤝<span>دیپلماسی</span></button>
    </nav>
  </section>
</div>

<div id="modal" class="modal hidden"><div class="modalbox"><button id="closeModal" class="close">×</button><div id="modalContent"></div></div></div>
<div id="countrySelectModal" class="modal hidden"><div class="modalbox"><button id="closeCountrySelect" class="close">×</button><div id="countryChoices"></div></div></div>
<div id="authModal" class="modal hidden"><div class="modalbox"><button id="closeAuth" class="close">×</button><div id="authContent"></div></div></div>
<div id="errorDisplay" class="error-display hidden" role="alert"><div class="error-title">⚠️ خطا</div><div id="errorDisplayText"></div><button id="errorDisplayClose" type="button">بستن</button></div>
<script src="./script.js"></script>
</body>
</html>
